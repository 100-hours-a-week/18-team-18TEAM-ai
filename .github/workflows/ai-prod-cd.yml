name: CD - PROD (AI)

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-prod-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25

    env:
      APP_NAME: "BizKit-AI"
      APP_STAGE: prod
      PYTHON_VERSION: "3.12"
      HEALTH_URL: http://127.0.0.1:8000/ai/health

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies (pip + semantic-release)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-semantic-release

      - name: Compile Check
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall app

      - name: Semantic Release (prod)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          semantic-release -c releaserc.toml version

      - name: Read version from VERSION file
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \n\r\t' < VERSION)"
          [[ -n "$VERSION" ]] || (echo "VERSION file is empty" >&2; exit 1)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials (Access Key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Buildah
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Login to ECR
        shell: bash
        run: |
          set -euo pipefail
          AWS_REGION="${{ secrets.AWS_REGION }}"
          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ECR_REPOSITORY="${{ secrets.ECR_REPOSITORY_AI_PROD }}"
          if [[ -z "${ECR_REPOSITORY}" ]]; then
            ECR_REPOSITORY="bizkit-ai-prod"
          fi
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          aws ecr get-login-password --region "${AWS_REGION}" | \
            buildah login --username AWS --password-stdin "${ECR_REGISTRY}"
          if ! aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" --region "${AWS_REGION}" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "${ECR_REPOSITORY}" --region "${AWS_REGION}" >/dev/null
          fi

          echo "ECR_REPOSITORY=${ECR_REPOSITORY}" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"

      - name: Build and Push AI Container Image
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.value }}"
          IMAGE_TAG="prod-${VERSION}-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --region "${{ secrets.AWS_REGION }}" >/dev/null 2>&1; then
            echo "Image already exists, skip build/push: ${IMAGE_URI}"
          else
            buildah bud --layers --arch arm64 -f Containerfile -t "${IMAGE_URI}" .
            if ! buildah push "${IMAGE_URI}"; then
              if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" \
                --image-ids imageTag="${IMAGE_TAG}" \
                --region "${{ secrets.AWS_REGION }}" >/dev/null 2>&1; then
                echo "Image was concurrently created by another run; reuse existing tag."
              else
                echo "buildah push failed for ${IMAGE_URI}" >&2
                exit 1
              fi
            fi
          fi

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Update cloud repo manifest for ArgoCD
        shell: bash
        env:
          CLOUD_REPO_TOKEN: ${{ secrets.CLOUD_REPO_TOKEN || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CLOUD_REPO_BRANCH: main
        run: |
          set -euo pipefail
          bash scripts/update-cloud-gitops-manifests.sh "${APP_STAGE}" "${IMAGE_URI}"

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MESSAGE="AI PROD GitOps CD 실패
          Repo: \`${{ github.repository }}\`
          Branch: \`${{ github.ref_name }}\`
          Workflow: \`${{ github.workflow }}\`
          Job: \`${{ github.job }}\`
          Actor: \`${{ github.actor }}\`
          Stage: \`${APP_STAGE}\`
          링크: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          JSON_MESSAGE=$(printf '%s\n' "$MESSAGE" | python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))')
          curl -X POST -H "Content-Type: application/json" -d "$JSON_MESSAGE" "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord on success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MESSAGE="✅ AI PROD GitOps CD 성공 ✅
          Repo: \`${{ github.repository }}\`
          Branch: \`${{ github.ref_name }}\`
          Workflow: \`${{ github.workflow }}\`
          Job: \`${{ github.job }}\`
          Actor: \`${{ github.actor }}\`
          Stage: \`${APP_STAGE}\`
          Version: \`${{ steps.ver.outputs.value }}\`
          링크: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          JSON_MESSAGE=$(printf '%s\n' "$MESSAGE" | python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))')
          curl -X POST -H "Content-Type: application/json" -d "$JSON_MESSAGE" "$DISCORD_WEBHOOK_URL"
